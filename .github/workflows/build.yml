name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: afk-bot
            artifact: afk-bot-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: afk-bot.exe
            artifact: afk-bot-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Linux system deps (libnut)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libpng-dev libxinerama-dev

      - name: Format check
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Compile
        shell: bash
        run: |
          mkdir -p dist
          deno compile \
            --allow-read --allow-write --allow-ffi \
            --allow-env --allow-sys \
            --include src/mouseMovement.ts \
            --target ${{ matrix.target }} \
            --output dist/${{ matrix.binary }} \
            src/main.ts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
